services:
  - type: web
    name: autobaza-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: PORT
        value: 10000
      # Origins permitted to call this API from a browser. This is the
      # browser-facing half of the frontend's deployment: when it drifts from
      # the live domain, every client-side fetch fails its preflight with 400
      # "Disallowed CORS origin" and the site renders with no data, while
      # /health keeps answering 200 and curl keeps working — CORS is enforced
      # by the browser, not by the server. This line has been wrong once per
      # rename: it named autobaza.vip after the move to nonstop-motors.com, and
      # nonstop-motors.com after the move to SMMotors Korea.
      # When the frontend's domain changes, this line changes in the same PR.
      # localhost is deliberately absent here; it lives in the code default.
      # NOTE: this blueprint has never been synced — app/core/config.py holds
      # the value production actually reads. Keep the two in step; the
      # consistency test in tests/test_cors.py fails if they diverge.
      # The trailing three origins are the RETIRED brand, kept deliberately;
      # delete them once that Vercel project is torn down.
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.smmotorskorea.com,https://smmotorskorea.com,https://smmotorskorea.vercel.app,https://smmotorskorea-dmitriy-shins-projects.vercel.app,https://www.nonstop-motors.com,https://nonstop-motors.com,https://nonstopautoapp.vercel.app
      # Vercel mints a hostname per branch and per commit, so preview frontends
      # can never appear in the list above. Starlette matches this with
      # re.fullmatch() against the whole Origin: no ^ or $, and escape every dot
      # (an unescaped `.` matches any character, so `.vercel.app` would also
      # accept `xvercelxapp`). The team slug is load-bearing — vercel.app is a
      # shared suffix, and a pattern ending at `-[a-z0-9-]+\.vercel\.app` also
      # matches a project a stranger creates in their own team. Unset -> previews
      # are refused, which is the safe default; never default this to a
      # permissive pattern.
      # NOTE: single quotes when setting a value. YAML rejects "\." inside a
      # double-quoted scalar with a ScannerError, which fails the whole sync.
      #
      # The alternation is deliberate. The obvious single-wildcard form,
      # https://smmotorskorea-[a-z0-9-]{1,48}-dmitriy-shins-projects\.vercel\.app,
      # also ACCEPTS https://smmotorskorea-git-dmitriy-shins-projects.vercel.app
      # — the wildcard matches just `git` and the `-dmitriy` prefix is absorbed
      # by a shorter team slug. Requiring `git-` to be followed by at least one
      # branch character, or the hash form to contain no hyphen, refuses it.
      #
      # 63-char DNS-label ceiling: the git form is `smmotorskorea-git-` (18) +
      # branch + `-dmitriy-shins-projects` (23) = 41 fixed, leaving 22 chars of
      # branch budget; the hash form is a fixed 46. Vercel therefore truncates
      # only into the branch, never into the team slug, and the appended hash
      # stays inside [a-z0-9-] and inside `git-…`. {1,40} is deliberate slack.
      #
      # Residual risk: `dmitriy-shins-projects` decomposes on hyphens, so this
      # also matches someone who owns the Vercel team slug `shins-projects` or
      # `projects` and names a project to absorb the missing prefix. That is
      # irreducible for any regex over the shared *.vercel.app suffix; the
      # exposed set is exactly those two slugs, and allow_credentials=False
      # plus GET/POST/OPTIONS means a match buys nothing curl cannot do.
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: 'https://smmotorskorea-(git-[a-z0-9-]{1,40}|[a-z0-9]{6,16})-dmitriy-shins-projects\.vercel\.app'
      # /docs, /redoc and /openapi.json publish the full route surface,
      # including admin and debug endpoints. Off in production.
      - key: ENABLE_API_DOCS
        value: "false"
      # Shared token for destructive endpoints (cache clear, auth reset,
      # Autohub token overwrite). Unset -> those endpoints fail closed with 503.
      # Secret: set in the Render dashboard.
      - key: ADMIN_API_TOKEN
        sync: false
      # Auction credentials. These were previously hardcoded in tracked source
      # (sk_auction_service.py, heydealer_auth_service.py,
      # enhanced_lotte_service.py) and duplicated in auctions-auth.txt, which
      # is still reachable in git history — ROTATE before setting these.
      - key: SK_AUCTION_USERNAME
        sync: false
      - key: SK_AUCTION_PASSWORD
        sync: false
      - key: HEYDEALER_USERNAME
        sync: false
      - key: HEYDEALER_PASSWORD
        sync: false
      - key: ENHANCED_LOTTE_USERNAME
        sync: false
      - key: ENHANCED_LOTTE_PASSWORD
        sync: false
      # The remaining four provider accounts. These are already set in the
      # dashboard — production authenticates fine — but were never declared
      # here, which is exactly the latent gap the GLOVIS_PROXY_HOST comment
      # below describes. An undeclared secret is invisible to the blueprint:
      # nothing tells you it exists, so a rebuild from this file alone yields
      # a service that boots healthy and 503s on every auction route.
      # LOTTE_* drives the main /api/v1/lotte/* path; ENHANCED_LOTTE_* above
      # only covers /api/v2/lotte and falls back to these when unset.
      - key: LOTTE_USERNAME
        sync: false
      - key: LOTTE_PASSWORD
        sync: false
      - key: AUTOHUB_USERNAME
        sync: false
      - key: AUTOHUB_PASSWORD
        sync: false
      # Optional pre-seeded JWT that lets Autohub skip the login round-trip.
      - key: AUTOHUB_JWT_TOKEN
        sync: false
      - key: KCAR_USERNAME
        sync: false
      - key: KCAR_PASSWORD
        sync: false
      # HappyCar is login-gated AND proxy-required (see AUCTION_PROXY_* below).
      - key: HAPPYCAR_USERNAME
        sync: false
      - key: HAPPYCAR_PASSWORD
        sync: false
      # Gates POST /api/v1/internal/glovis/cache/clear. Required by
      # docs/glovis-dbauto-deployment.md; unset -> that route fails closed.
      - key: GLOVIS_CACHE_ADMIN_TOKEN
        sync: false
      # Wednesday-snapshot mode (see plans/wednesday-snapshot-mode.md).
      # Deploy dark first: leave AUTOHUB_SNAPSHOT_ENABLED=false until the
      # first manual run is verified, then flip to true.
      - key: AUTOHUB_SNAPSHOT_ENABLED
        value: "false"
      - key: AUTOHUB_SNAPSHOT_DAYS
        value: "2"
      - key: AUTOHUB_SNAPSHOT_DB_PATH
        value: /data/autohub_snapshot.db
      - key: AUTOHUB_SNAPSHOT_RETENTION
        value: "2"
      - key: AUTOHUB_SNAPSHOT_TIMEZONE
        value: Asia/Seoul
      - key: AUTOHUB_SNAPSHOT_MAX_AGE_DAYS
        value: "8"
      # Set in the Render dashboard (sync: false in YAML to avoid logging the secret).
      - key: AUTOHUB_SNAPSHOT_ADMIN_TOKEN
        sync: false
      # Shared auction proxy. Encar is proxy-OPTIONAL (api.encar.com answers
      # non-Korean IPs); HappyCar is proxy-REQUIRED and fails closed without
      # these. Secrets: set in the Render dashboard. sync:false keeps the
      # value dashboard-managed and out of the blueprint and build logs.
      - key: AUCTION_PROXY_HOST
        sync: false
      - key: AUCTION_PROXY_USERNAME
        sync: false
      - key: AUCTION_PROXY_PASSWORD
        sync: false
      # Extra pool entries as a JSON array, appended to the three names above
      # so the pool round-robins across every provider. Adding a proxy means
      # editing this one value; the variables above stay untouched.
      #   [{"name":"...","host":"host:port","username":"...","password":"..."}]
      - key: AUCTION_PROXY_POOL
        sync: false
      # Dedicated Korean residential proxy for HeyDealer (anti-throttle on the
      # single shared dealer account/IP). Sticky-session provider: keep the
      # session-<id> inside the username so every request reuses one exit IP —
      # HeyDealer binds its session cookie to the login IP. Secrets: set in the
      # Render dashboard (sync:false). Unset -> HeyDealer uses direct egress.
      - key: HEYDEALER_PROXY_HOST
        sync: false
      - key: HEYDEALER_PROXY_PORT
        sync: false
      - key: HEYDEALER_PROXY_USERNAME
        sync: false
      - key: HEYDEALER_PROXY_PASSWORD
        sync: false
      # Egress gate for AsyncHttpClient consumers (Encar catalog, /api/catalog,
      # /api/nav, Encar trucks, Green equipment). Direct egress is the
      # verified-good default and avoids spending metered proxy bandwidth on
      # high-volume catalog traffic. Flip to "true" only if Encar begins
      # blocking Render addresses — no code change or redeploy required.
      # Note this does NOT disable HappyCar's proxy: happycar_service.py calls
      # get_proxy_pool() directly and never consults USE_PROXY.
      - key: USE_PROXY
        value: "false"
      # Dedicated Korean egress for DB Auto Glovis. Currently set in the
      # dashboard but previously undeclared here — the same latent gap that
      # caused the AUCTION_PROXY_* outage. See docs/glovis-dbauto-deployment.md.
      - key: GLOVIS_PROXY_HOST
        sync: false
      - key: GLOVIS_PROXY_USERNAME
        sync: false
      - key: GLOVIS_PROXY_PASSWORD
        sync: false
      - key: GLOVIS_PROXY_COUNTRY
        sync: false
      - key: GLOVIS_PROXY_EGRESS_LABEL
        sync: false
    healthCheckPath: /health
    disk:
      name: autohub-cache
      mountPath: /data
      sizeGB: 2
